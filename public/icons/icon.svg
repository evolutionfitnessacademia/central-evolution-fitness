<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Metallic Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Bold Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E36" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#DC2626" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Solid Black Canvas -->
  <rect width="512" height="512" fill="#000000" />
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Outer Silver Geometric Ring (Safe Zone Border) -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#silverGrad)" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#DC2626" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="12 6" />

  <!-- Central Dynamic Monogram "EF" -->
  <g transform="translate(0, -10)" filter="url(#redGlow)">
    <!-- Stylized "E" (Silver and Powerful) -->
    <!-- E Backbone -->
    <polygon points="126,110 178,110 148,290 96,290" fill="url(#silverGrad)" />
    <!-- E Top Bar -->
    <polygon points="172,110 270,110 262,152 165,152" fill="url(#silverGrad)" />
    <!-- E Middle Bar (Vibrant Red) -->
    <polygon points="158,185 242,185 235,222 152,222" fill="url(#redGrad)" />
    <!-- E Bottom Bar -->
    <polygon points="144,250 252,250 245,290 137,290" fill="url(#silverGrad)" />

    <!-- Stylized "F" (Red Accent and Forward Slant) -->
    <!-- F Backbone -->
    <polygon points="274,110 326,110 296,290 244,290" fill="url(#redGrad)" />
    <!-- F Top Bar -->
    <polygon points="320,110 416,110 408,152 313,152" fill="url(#redGrad)" />
    <!-- F Middle Bar -->
    <polygon points="306,185 390,185 383,222 299,222" fill="url(#silverGrad)" />

    <!-- Forward Chevron / Pulse Accent -->
    <polygon points="386,250 416,250 398,290 368,290" fill="url(#redGrad)" />
  </g>

  <!-- Typography: EVOLUTION (Silver) -->
  <text x="256" y="360"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="34"
        font-weight="900"
        letter-spacing="5"
        fill="url(#silverGrad)"
        text-anchor="middle">
    EVOLUTION
  </text>

  <!-- Typography: FITNESS (Red) -->
  <text x="256" y="405"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="30"
        font-weight="900"
        letter-spacing="8"
        fill="url(#redGrad)"
        text-anchor="middle">
    FITNESS
  </text>

  <!-- Bottom Accent Stripe -->
  <rect x="186" y="425" width="140" height="4" rx="2" fill="url(#silverGrad)" />
</svg>
